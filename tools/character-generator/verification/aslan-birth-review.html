<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Aslan birth order design review</title><link rel="stylesheet" href="../styles.css"><link rel="stylesheet" href="../gui/aslan-family-popup.css"><style>body{background:#03111c;color:#f1f5f8}header h1{color:#ffd052}#aslan-family-dialog .birth-dice{display:flex;justify-content:center;gap:10px}#aslan-family-dialog .birth-dice svg{width:150px;height:150px;margin:10px 0}#aslan-family-dialog .aslan-family-ready .birth-note{font-size:18px;max-width:600px;margin:0 auto 20px}#aslan-family-dialog .aslan-family-ready h3{font-size:40px}@media(max-width:650px){#aslan-family-dialog .birth-dice svg{width:110px;height:110px}#aslan-family-dialog .aslan-family-ready h3{font-size:28px}}</style></head><body><header><div><h1>CHARACTER BUILDER</h1><p>TRAVELLER RPG</p></div></header><main class="layout"><section id="workspace"><p class="eyebrow">BACKGROUND</p><h2>Your family and heritage</h2></section><aside id="sheet"><h2>Character summary</h2><p>Aslan · Male</p></aside></main><script type="module">
import {aslanFamilyPopupView} from '../gui/aslan-family-popup.mjs';
const esc=x=>String(x??'').replaceAll('&','&amp;').replaceAll('<','&lt;');
let html=aslanFamilyPopupView({bandLabel:'Male'},{esc});
html=html.replace('FAMILY BACKGROUND · ROLL 1D','DESIGN REVIEW · BIRTH ORDER').replace('Your family background','Your place in the family').replace('Ready to discover your<br>family background?','Every family has a firstborn.<br>Where do you stand?').replace('>Roll</button>','>Roll 2D</button>').replace('Your roll number and result will appear here.','11–12: Firstborn son · 2–10: Later son.').replace('AoCS1 Update 2026, pp. 15–17','AoCS1 Update 2026, p. 16');
const svg=html.match(/<svg[\s\S]*?<\/svg>/)[0];html=html.replace(svg,'<div class="birth-dice">'+svg+svg+'</div>');html=html.replace('</div><footer>','<p class="birth-note">Your place in the family determines inheritance eligibility. It does not give you land now.</p></div><footer>');
document.body.insertAdjacentHTML('beforeend',html);const dialog=document.querySelector('dialog');dialog.showModal();dialog.addEventListener('cancel',e=>e.preventDefault());document.querySelector('#aslan-family-roll').addEventListener('click',()=>{document.querySelector('#aslan-family-error').textContent='Design review only. No dice have been rolled.';});
</script></body></html>
