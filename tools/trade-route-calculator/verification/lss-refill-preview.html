<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Life support refill — draft review</title>
<style>
*{box-sizing:border-box}body{margin:0;padding:24px;background:#07111e;color:#e5f7ff;font:16px system-ui,sans-serif}.lss-refill{max-width:680px;margin:auto;padding:28px;border:1px solid #315067;border-radius:18px;background:linear-gradient(145deg,#12283b,#0b1b2d)}button,input{font:inherit;color:inherit;background:#102b40;border:1px solid #426c83;border-radius:8px;padding:10px}button{cursor:pointer}button:disabled{opacity:.5;cursor:default}button:focus-visible,input:focus-visible{outline:3px solid #7ae4f5;outline-offset:3px}h2{font-size:32px;margin:25px 0 8px}h3{font-size:24px;border-top:1px solid #315067;padding-top:24px}p,small,label span{color:#a8c5d6}label{display:block}label span{display:block;font-size:14px;margin-top:6px}.lss-top,.lss-target,.lss-capacity,.lss-cargo,.lss-actions{display:flex;align-items:center;justify-content:space-between;gap:16px}.lss-top button{border:0;background:transparent;padding:0}.lss-aboard{margin:30px 0}.lss-aboard span,.lss-metrics span,.lss-total span{display:block;color:#b6d2e1}.lss-aboard strong{display:block;font-size:64px;color:#e5fbff}.lss-metrics{display:grid;grid-template-columns:1fr 1fr;gap:24px}.lss-metrics strong{display:block;font-size:34px;font-weight:650;color:#e5fbff;margin-top:8px}.lss-target{margin-top:20px}.lss-target input{width:75%;accent-color:#72dcf0;padding:0}.lss-range-labels{display:flex;justify-content:space-between;width:75%;color:#a8c5d6;font-size:14px;margin:8px 0 30px}.lss-stepper{display:flex;gap:8px;align-items:center}.lss-stepper input{width:100px;text-align:center}.lss-capacity{margin-top:22px;padding-bottom:20px;border-bottom:1px solid #315067}#lss-reason{width:100%;margin-top:10px}.lss-total{margin:24px 0;padding:22px;background:#142f42;border:1px solid #3c7185;border-radius:10px}.lss-total strong{display:block;color:#9ceefa;font-size:36px;margin:10px 0}.lss-total small{display:block}.lss-actions{justify-content:flex-end;margin:20px 0}.primary{background:#96e9f4;color:#082637}.lss-blocked{font-size:14px}.lss-audit{margin-top:24px}.review-note{max-width:680px;margin:16px auto;font-size:14px}.lss-refill>button[data-refill-action=gm]{width:100%}@media(max-width:540px){body{padding:10px}.lss-refill{padding:18px}.lss-metrics{grid-template-columns:1fr}.lss-cargo,.lss-capacity{align-items:flex-start;flex-direction:column}.lss-metrics strong{font-size:32px}.lss-target input,.lss-range-labels{width:65%}.lss-stepper input{width:100px}}
</style>
<main id="preview"></main><p class="review-note">Synthetic design fixture. No campaign data, storage access, payments or saves. Prices remain unavailable pending accounting decisions.</p>
<script type="module">
import {createRefillDraft,editRefillDraft,renderRefillDraft} from '../js/lss-refill-draft.mjs';
const initial=()=>createRefillDraft({internal:'165.8',cargo:'0',internalCapacity:'800',cargoCapacity:'6000',dailyUnits:'6'});
let draft=initial();const root=document.getElementById('preview');
function render(){root.innerHTML=renderRefillDraft(draft,{shipLabel:'Hypothetical LSS Trader — at Sample Anchorage'});}
function refreshMetrics(){const template=document.createElement('template');template.innerHTML=renderRefillDraft(draft,{shipLabel:'Hypothetical LSS Trader — at Sample Anchorage'});for(const selector of ['.lss-aboard','.lss-metrics','.lss-target output','.lss-capacity>span','.lss-overflow','.lss-total'])root.querySelector(selector).replaceWith(template.content.querySelector(selector));}
root.addEventListener('input',event=>{const key=event.target.dataset.refillInput;if(!key)return;try{draft=editRefillDraft(draft,key,event.target.value);event.target.setCustomValidity('');if(key!=='reason')refreshMetrics();}catch(error){event.target.setCustomValidity(error.message);event.target.reportValidity();}});
root.addEventListener('click',event=>{const action=event.target.closest('[data-refill-action]')?.dataset.refillAction;if(!action)return;if(action==='audit'){root.querySelector('details').open=true;return;}if(action==='cancel')draft=initial();else if(action==='plus'||action==='minus')draft=editRefillDraft(draft,'cargo-step',action==='plus'?1:-1);else if(action==='fill-cargo')draft=editRefillDraft(draft,action);render();});
render();
</script></html>
