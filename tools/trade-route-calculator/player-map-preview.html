<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src https://travellermap.com; connect-src https://travellermap.com; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="no-referrer">
<title>Player map · standalone preview</title>
<link rel="stylesheet" href="player-snapshot.css?v=map-parity-20261020-100"><link rel="stylesheet" href="player-map-preview.css">
<script type="module" src="js/player-map-preview.mjs?v=map-parity-20261020-100"></script>
</head>
<body>
<header><p class="eyebrow">STANDALONE MAP REVIEW</p><h1>Nearby systems</h1><p id="origin-label">Sample reference origin: Regina · Spinward Marches / 1910</p></header>
<main>
<section class="map-panel">
<label for="radius">Hex radius <output id="radius-value" for="radius">2</output></label>
<input id="radius" type="range" min="0" max="6" step="1" value="2">
<span id="map-help"></span><p id="map-status" role="status">Loading reference map…</p>
<div id="map-frame" aria-label="Reference map"></div>
<button id="current-world" type="button" disabled>Current World</button>
<button id="map-retry" type="button">Retry map and details</button>
</section>
<section class="world-panel" aria-label="Selected world reference"><div id="world-details" aria-live="polite"><p>Loading system details…</p></div>

</section>
</main>

</body></html>
