name: Trade calculator checks

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - 'tools/trade-route-calculator/**'
      - 'tests/**'
      - 'assets/**'
      - '.github/workflows/mail-browser.yml'

# Read-only exact-head verification. No deployment, repository-write token,
# user credentials, campaign data or repository secrets are used.
permissions:
  contents: read

concurrency:
  group: trade-checks-${{ github.event.pull_request.number }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash
    working-directory: tools/trade-route-calculator

env:
  CI: 'true'
  TRAVELLER_TEST_URL: http://127.0.0.1:8765/
  TRAVELLER_COMMIT: ${{ github.event.pull_request.head.sha }}

jobs:
  native:
    name: All native and rules checks
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out exact PR head
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
      - name: Record tested revision and check syntax
        run: |
          mkdir -p verification-artifacts
          test "$(git rev-parse HEAD)" = "$TRAVELLER_COMMIT"
          git rev-parse HEAD > verification-artifacts/commit.txt
          node --version > verification-artifacts/runtime.txt
          python3 --version >> verification-artifacts/runtime.txt
          for file in js/*.mjs verification/*.mjs; do node --check "$file"; done
      - name: Run every native suite
        run: node verification/run-native.mjs | tee verification-artifacts/native.txt
      - name: Check rules data
        if: ${{ !cancelled() }}
        run: python3 verification/check_rules.py | tee verification-artifacts/rules-data.txt
      - name: Check shared tool integration
        if: ${{ !cancelled() }}
        run: node --test ../../tests/tool-visits.test.cjs | tee verification-artifacts/tool-visits.txt
      - name: Upload native evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: trade-native-${{ github.event.pull_request.head.sha }}
          path: tools/trade-route-calculator/verification-artifacts/
          if-no-files-found: error
          retention-days: 14

  browser:
    name: Chromium (${{ matrix.suite }})
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        suite: [browser, modal-lifecycle, click-route, fuel-browser, empty-space, mail-browser, map-overview-browser, gui-parity, trade-buttons, settings-browser, insurance-browser, trade-complications-browser, world-screen-browser, jump-undo-browser, service-panels-browser, combined-cabins, day-controls, zero-fuel, resource-alert, mortgage-browser, expense-panels-browser, cargo-hold-browser, route-frame-browser, inline-fuel-browser, service-navigation-browser, passengers-browser, route-selection-browser, trade-audit-browser]
    steps:
      - name: Check out exact PR head
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
      - name: Record tested revision
        run: |
          mkdir -p verification-artifacts
          test "$(git rev-parse HEAD)" = "$TRAVELLER_COMMIT"
          git rev-parse HEAD > verification-artifacts/commit.txt
          node --version > verification-artifacts/runtime.txt
          python3 --version >> verification-artifacts/runtime.txt
      - name: Install pinned Playwright and Chromium
        run: |
          npm install --prefix "$RUNNER_TEMP/trade-playwright" --no-save --package-lock=false --ignore-scripts --no-audit --no-fund playwright@1.58.2
          node "$RUNNER_TEMP/trade-playwright/node_modules/playwright/cli.js" install --with-deps chromium
          node "$RUNNER_TEMP/trade-playwright/node_modules/playwright/cli.js" --version >> verification-artifacts/runtime.txt
      - name: Test real browser flows
        env:
          SUITE: ${{ matrix.suite }}
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 > verification-artifacts/server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in {1..30}; do
            if curl --fail --silent "$TRAVELLER_TEST_URL" > /dev/null; then break; fi
            sleep 1
          done
          curl --fail --silent "$TRAVELLER_TEST_URL" > /dev/null
          node "verification/$SUITE.test.mjs" "$RUNNER_TEMP/trade-playwright/node_modules/playwright" | tee "verification-artifacts/$SUITE.txt"
      - name: Upload browser evidence
        if: ${{ always() && matrix.suite != 'route-frame-browser' && matrix.suite != 'inline-fuel-browser' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: trade-${{ matrix.suite }}-${{ github.event.pull_request.head.sha }}
          path: tools/trade-route-calculator/verification-artifacts/
          if-no-files-found: error
          retention-days: 14
      - name: Prepare bounded route-frame visuals
        id: route_visual_evidence
        if: ${{ always() && matrix.suite == 'route-frame-browser' }}
        run: |
          python3 - <<'PYTHON'
          from pathlib import Path
          from shutil import copyfile
          source = Path('verification-artifacts')
          for width in [1440, 1100, 390, 320]:
              target = source / f'route-frame-visual-{width}'
              target.mkdir(exist_ok=True)
              files = list(source.glob(f'route-frame-*-{width}*.png'))
              files += [source / name for name in ['route-frame-report.json', 'commit.txt', 'runtime.txt', 'route-frame-browser.txt']]
              for file in files:
                  if file.is_file():
                      copyfile(file, target / file.name)
              size = sum(file.stat().st_size for file in target.iterdir() if file.is_file())
              if size >= 30 * 1024 * 1024:
                  raise RuntimeError(f'Route visual evidence at {width}px exceeds the safe download bound: {size} bytes')
              print(f'Route visual evidence at {width}px: {size} bytes')
          PYTHON
      - name: Upload route-frame traces
        if: ${{ always() && matrix.suite == 'route-frame-browser' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: trade-route-frame-traces-${{ github.event.pull_request.head.sha }}
          path: |
            tools/trade-route-calculator/verification-artifacts/route-frame-*-trace.zip
            tools/trade-route-calculator/verification-artifacts/commit.txt
            tools/trade-route-calculator/verification-artifacts/route-frame-browser.txt
          if-no-files-found: error
          retention-days: 14
      - name: Upload compact route-frame visuals 1440px
        if: ${{ always() && matrix.suite == 'route-frame-browser' && steps.route_visual_evidence.outcome == 'success' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: trade-route-frame-visual-1440-${{ github.event.pull_request.head.sha }}
          path: tools/trade-route-calculator/verification-artifacts/route-frame-visual-1440/
          if-no-files-found: error
          retention-days: 14
      - name: Upload compact route-frame visuals 1100px
        if: ${{ always() && matrix.suite == 'route-frame-browser' && steps.route_visual_evidence.outcome == 'success' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: trade-route-frame-visual-1100-${{ github.event.pull_request.head.sha }}
          path: tools/trade-route-calculator/verification-artifacts/route-frame-visual-1100/
          if-no-files-found: error
          retention-days: 14
      - name: Upload compact route-frame visuals 390px
        if: ${{ always() && matrix.suite == 'route-frame-browser' && steps.route_visual_evidence.outcome == 'success' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: trade-route-frame-visual-390-${{ github.event.pull_request.head.sha }}
          path: tools/trade-route-calculator/verification-artifacts/route-frame-visual-390/
          if-no-files-found: error
          retention-days: 14
      - name: Upload compact route-frame visuals 320px
        if: ${{ always() && matrix.suite == 'route-frame-browser' && steps.route_visual_evidence.outcome == 'success' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: trade-route-frame-visual-320-${{ github.event.pull_request.head.sha }}
          path: tools/trade-route-calculator/verification-artifacts/route-frame-visual-320/
          if-no-files-found: error
          retention-days: 14
      - name: Prepare bounded service-control visuals
        id: service_visual_evidence
        if: ${{ always() && matrix.suite == 'inline-fuel-browser' }}
        run: |
          python3 - <<'PYTHON'
          from pathlib import Path
          from shutil import copyfile
          source = Path('verification-artifacts')
          for width in [1440, 1100, 390, 320]:
              target = source / f'inline-fuel-visual-{width}'
              target.mkdir(exist_ok=True)
              files = list(source.glob(f'inline-fuel-*-{width}.png'))
              files += [source / name for name in ['inline-fuel-report.json', 'commit.txt', 'runtime.txt', 'inline-fuel-browser.txt']]
              for file in files:
                  if file.is_file():
                      copyfile(file, target / file.name)
              size = sum(file.stat().st_size for file in target.iterdir() if file.is_file())
              if size >= 30 * 1024 * 1024:
                  raise RuntimeError(f'Service visual evidence at {width}px exceeds the safe download bound: {size} bytes')
              print(f'Service visual evidence at {width}px: {size} bytes')
          PYTHON
      - name: Upload service-control traces
        if: ${{ always() && matrix.suite == 'inline-fuel-browser' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: trade-inline-fuel-traces-${{ github.event.pull_request.head.sha }}
          path: |
            tools/trade-route-calculator/verification-artifacts/inline-fuel-trace-*.zip
            tools/trade-route-calculator/verification-artifacts/commit.txt
            tools/trade-route-calculator/verification-artifacts/inline-fuel-browser.txt
          if-no-files-found: error
          retention-days: 14
      - name: Upload compact service-control visuals 1440px
        if: ${{ always() && matrix.suite == 'inline-fuel-browser' && steps.service_visual_evidence.outcome == 'success' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: trade-inline-fuel-visual-1440-${{ github.event.pull_request.head.sha }}
          path: tools/trade-route-calculator/verification-artifacts/inline-fuel-visual-1440/
          if-no-files-found: error
          retention-days: 14
      - name: Upload compact service-control visuals 1100px
        if: ${{ always() && matrix.suite == 'inline-fuel-browser' && steps.service_visual_evidence.outcome == 'success' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: trade-inline-fuel-visual-1100-${{ github.event.pull_request.head.sha }}
          path: tools/trade-route-calculator/verification-artifacts/inline-fuel-visual-1100/
          if-no-files-found: error
          retention-days: 14
      - name: Upload compact service-control visuals 390px
        if: ${{ always() && matrix.suite == 'inline-fuel-browser' && steps.service_visual_evidence.outcome == 'success' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: trade-inline-fuel-visual-390-${{ github.event.pull_request.head.sha }}
          path: tools/trade-route-calculator/verification-artifacts/inline-fuel-visual-390/
          if-no-files-found: error
          retention-days: 14
      - name: Upload compact service-control visuals 320px
        if: ${{ always() && matrix.suite == 'inline-fuel-browser' && steps.service_visual_evidence.outcome == 'success' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: trade-inline-fuel-visual-320-${{ github.event.pull_request.head.sha }}
          path: tools/trade-route-calculator/verification-artifacts/inline-fuel-visual-320/
          if-no-files-found: error
          retention-days: 14
      - name: Upload compact GUI screenshots
        if: ${{ always() && matrix.suite == 'gui-parity' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: trade-gui-screenshots-${{ github.event.pull_request.head.sha }}
          path: |
            tools/trade-route-calculator/verification-artifacts/*.png
            tools/trade-route-calculator/verification-artifacts/commit.txt
            tools/trade-route-calculator/verification-artifacts/gui-parity.txt
          if-no-files-found: error
          retention-days: 14
      - name: Upload compact Cargo Hold screenshots and report
        if: ${{ always() && matrix.suite == 'cargo-hold-browser' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: trade-cargo-screenshots-${{ github.event.pull_request.head.sha }}
          path: |
            tools/trade-route-calculator/verification-artifacts/cargo-hold-*.png
            tools/trade-route-calculator/verification-artifacts/cargo-hold-report.json
            tools/trade-route-calculator/verification-artifacts/cargo-hold-browser.txt
            tools/trade-route-calculator/verification-artifacts/commit.txt
          if-no-files-found: error
          retention-days: 14
      - name: Upload compact service-navigation screenshots and report
        if: ${{ always() && matrix.suite == 'service-navigation-browser' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: trade-service-navigation-visuals-${{ github.event.pull_request.head.sha }}
          path: |
            tools/trade-route-calculator/verification-artifacts/service-navigation-*.png
            tools/trade-route-calculator/verification-artifacts/service-navigation-report.json
            tools/trade-route-calculator/verification-artifacts/service-navigation-browser.txt
            tools/trade-route-calculator/verification-artifacts/commit.txt
          if-no-files-found: error
          retention-days: 14
      - name: Summarize scope
        if: always()
        env:
          SUITE: ${{ matrix.suite }}
        run: |
          {
            echo "## Chromium: $SUITE"
            echo "Exact PR head: $TRAVELLER_COMMIT"
            echo 'Synthetic campaigns and deterministic Traveller Map fixtures; no user campaign data or deployment.'
            echo 'All native and rules checks run independently; a failed browser suite does not cancel the other evidence.'
            echo 'Live Traveller Map availability and unlisted browser scripts are outside this deterministic gate.'
          } >> "$GITHUB_STEP_SUMMARY"
