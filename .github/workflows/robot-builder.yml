name: Robot Builder checks
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - 'tools/robot-builder/**'
      - '.github/workflows/robot-builder.yml'
permissions:
  contents: read
concurrency:
  group: robot-builder-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '22'
      - name: Record exact head and verify modules
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          mkdir -p verification-artifacts/robot
          git rev-parse HEAD > verification-artifacts/robot/commit.txt
          for file in tools/robot-builder/engine/*.mjs tools/robot-builder/js/*.mjs tools/robot-builder/verification/*.mjs; do node --check "$file"; done
          node --test tools/robot-builder/verification/*.test.mjs | tee verification-artifacts/robot/native.txt
      - name: Install pinned browser runner
        run: |
          npm install --prefix "$RUNNER_TEMP/robot-playwright" --no-save --package-lock=false --ignore-scripts --no-audit --no-fund playwright@1.58.2
          node "$RUNNER_TEMP/robot-playwright/node_modules/playwright/cli.js" install --with-deps chromium
      - name: Exercise desktop and mobile workflows
        env:
          ROBOT_TEST_URL: http://127.0.0.1:8778/tools/robot-builder/
        run: |
          python3 -m http.server 8778 --bind 127.0.0.1 > verification-artifacts/robot/server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in {1..30}; do if curl --fail --silent "$ROBOT_TEST_URL" > /dev/null; then break; fi; sleep 1; done
          curl --fail --silent "$ROBOT_TEST_URL" > /dev/null
          node tools/robot-builder/verification/browser.mjs "$RUNNER_TEMP/robot-playwright/node_modules/playwright"
          node tools/robot-builder/verification/construction-browser.mjs "$RUNNER_TEMP/robot-playwright/node_modules/playwright"
          node tools/robot-builder/verification/vehicle-options-browser.mjs "$RUNNER_TEMP/robot-playwright/node_modules/playwright"
          node tools/robot-builder/verification/conditional-melee-browser.mjs "$RUNNER_TEMP/robot-playwright/node_modules/playwright"
          node tools/robot-builder/verification/shields-expendable-melee-browser.mjs "$RUNNER_TEMP/robot-playwright/node_modules/playwright"
          node tools/robot-builder/verification/external-wear-browser.mjs "$RUNNER_TEMP/robot-playwright/node_modules/playwright"
          node tools/robot-builder/verification/metamorphic-browser.mjs "$RUNNER_TEMP/robot-playwright/node_modules/playwright"
          node tools/robot-builder/verification/vehicle-utilities-browser.mjs "$RUNNER_TEMP/robot-playwright/node_modules/playwright"
          node tools/robot-builder/verification/specialised-ammunition-browser.mjs "$RUNNER_TEMP/robot-playwright/node_modules/playwright"
      - name: Upload bounded verification evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: robot-builder-${{ github.event.pull_request.head.sha }}
          path: verification-artifacts/robot/
          if-no-files-found: warn
          retention-days: 14
