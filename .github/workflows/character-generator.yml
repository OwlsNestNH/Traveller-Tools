name: Character generator checks
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - 'tools/character-generator/**'
      - '.github/workflows/character-generator.yml'
permissions:
  contents: read
jobs:
  character-generator:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '22'
      - name: Syntax and rules regressions
        run: |
          for file in tools/character-generator/engine/*.mjs tools/character-generator/gui/*.mjs tools/character-generator/server.mjs; do node --check "$file"; done
          node --test tools/character-generator/verification/*.test.mjs
          node tools/character-generator/verification/career-smoke.mjs
      - name: Install pinned Chromium runner
        run: |
          npm install --prefix "$RUNNER_TEMP/character-playwright" --no-save --package-lock=false --ignore-scripts --no-audit --no-fund playwright@1.58.2
          node "$RUNNER_TEMP/character-playwright/node_modules/playwright/cli.js" install --with-deps chromium
      - name: Desktop and mobile character interactions
        run: |
          node tools/character-generator/verification/browser.mjs "$RUNNER_TEMP/character-playwright/node_modules/playwright"
          node tools/character-generator/verification/review-browser.mjs "$RUNNER_TEMP/character-playwright/node_modules/playwright"
          node tools/character-generator/verification/expansion-browser.mjs "$RUNNER_TEMP/character-playwright/node_modules/playwright"
          node tools/character-generator/verification/benefit-browser.mjs "$RUNNER_TEMP/character-playwright/node_modules/playwright"
          node tools/character-generator/verification/games-browser.mjs "$RUNNER_TEMP/character-playwright/node_modules/playwright"
          node tools/character-generator/verification/aezorgh-browser.mjs "$RUNNER_TEMP/character-playwright/node_modules/playwright"
          node tools/character-generator/verification/recovery-browser.mjs "$RUNNER_TEMP/character-playwright/node_modules/playwright"
          node tools/character-generator/verification/transfer-browser.mjs "$RUNNER_TEMP/character-playwright/node_modules/playwright"
          node tools/character-generator/verification/reeducation-browser.mjs "$RUNNER_TEMP/character-playwright/node_modules/playwright"
      - name: Upload review screenshots and results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: character-generator-review-${{ github.event.pull_request.head.sha }}
          path: tools/character-generator/verification/artifacts/
          if-no-files-found: warn
