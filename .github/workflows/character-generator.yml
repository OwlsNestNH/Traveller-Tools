name: Character generator checks
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - 'tools/character-generator/**'
      - 'index.html'
      - 'changes/character.html'
      - 'assets/js/tool-visits.js'
      - 'tests/tool-visits.test.cjs'
      - '.github/workflows/character-generator.yml'
permissions:
  contents: read
jobs:
  current-character-sheet:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '22'
      - name: Install pinned browser runner
        run: |
          npm install --prefix "$RUNNER_TEMP/character-playwright" --no-save --package-lock=false --ignore-scripts --no-audit --no-fund playwright@1.58.2
          node "$RUNNER_TEMP/character-playwright/node_modules/playwright/cli.js" install --with-deps chromium
      - name: Verify replaceable current and finished sheets
        run: |
          node tools/character-generator/verification/clan-share-contrast-browser.mjs "$RUNNER_TEMP/character-playwright/node_modules/playwright"
          node tools/character-generator/verification/current-sheet-browser.mjs "$RUNNER_TEMP/character-playwright/node_modules/playwright"
          node tools/character-generator/verification/final-sheet-browser.mjs "$RUNNER_TEMP/character-playwright/node_modules/playwright"
      - name: Upload sheet review
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: current-character-sheet-review-${{ github.event.pull_request.head.sha }}
          path: |
            tools/character-generator/verification/artifacts/clan-share-contrast-*
            tools/character-generator/verification/artifacts/current-sheet-*
            tools/character-generator/verification/artifacts/final-sheet-*
          if-no-files-found: warn
  statistics-taglines:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '22'
      - name: Install pinned Chromium runner
        run: |
          npm install --prefix "$RUNNER_TEMP/character-playwright" --no-save --package-lock=false --ignore-scripts --no-audit --no-fund playwright@1.58.2
          node "$RUNNER_TEMP/character-playwright/node_modules/playwright/cli.js" install --with-deps chromium
      - name: Verify statistical taglines and capture review screenshots
        run: node tools/character-generator/verification/outcome-taglines-browser.mjs "$RUNNER_TEMP/character-playwright/node_modules/playwright"
      - name: Upload tagline review
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: statistics-taglines-review-${{ github.event.pull_request.head.sha }}
          path: tools/character-generator/verification/artifacts/outcome-taglines-*
          if-no-files-found: warn
  aslan-training-taglines:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '22'
      - name: Install pinned Chromium runner
        run: |
          npm install --prefix "$RUNNER_TEMP/character-playwright" --no-save --package-lock=false --ignore-scripts --no-audit --no-fund playwright@1.58.2
          node "$RUNNER_TEMP/character-playwright/node_modules/playwright/cli.js" install --with-deps chromium
      - name: Verify Aslan training taglines and capture review screenshots
        run: node tools/character-generator/verification/aslan-training-tagline-browser.mjs "$RUNNER_TEMP/character-playwright/node_modules/playwright"
      - name: Upload tagline review
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: aslan-training-taglines-review-${{ github.event.pull_request.head.sha }}
          path: tools/character-generator/verification/artifacts/aslan-training-tagline-*
          if-no-files-found: warn
  character-generator:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '22'
      - name: Syntax and rules regressions
        run: |
          for file in tools/character-generator/engine/*.mjs tools/character-generator/gui/*.mjs tools/character-generator/server*.mjs; do node --check "$file"; done
          node tests/tool-visits.test.cjs
          node --test tools/character-generator/verification/*.test.mjs
          node tools/character-generator/verification/career-smoke.mjs
      - name: Install pinned Chromium runner
        id: browser-install
        run: |
          npm install --prefix "$RUNNER_TEMP/character-playwright" --no-save --package-lock=false --ignore-scripts --no-audit --no-fund playwright@1.58.2
          # Ubuntu 24.04 runners provide Chromium runtime libraries and standard fonts.
          node "$RUNNER_TEMP/character-playwright/node_modules/playwright/cli.js" install chromium
      - name: Compact character sheet interactions
        run: node tools/character-generator/verification/final-sheet-browser.mjs "$RUNNER_TEMP/character-playwright/node_modules/playwright"
      - name: Upload compact sheet review
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: final-character-sheet-review-${{ github.event.pull_request.head.sha }}
          path: tools/character-generator/verification/artifacts/final-sheet-*
          if-no-files-found: warn
      - name: Desktop and mobile release and mixed-scope interactions
        if: ${{ !cancelled() && steps.browser-install.outcome == 'success' }}
        run: |
          failures=0
          for suite in iron-man-browser crow-recovery-browser technical-error-browser required-headlines-browser required-action-effects-browser required-action-browser aslan-initial-sex-browser aezorgh-optional-charisma-browser aezorgh-skill-popup-browser background-skills-browser physical-dice-browser psi-activation-browser statistic-editor-browser psi-testing-browser imperial-vargr-browser career-info-browser cancel-character-browser beta-notice-browser flat-luck-browser connections-finalization-browser opening-facelift-browser characteristics-facelift-browser opening-help-browser simple-log-browser finalization-ledgers-browser aslan-event-outcomes-browser equipment-catalogue-browser equipment-finalization-browser academy-gm-option-browser event-results-browser career-step-separation-browser female-independence-browser believer-buyout-browser aslan-skill-culture-browser full-log-browser immediate-specializations-browser deferred-specializations-browser education-skill-browser prisoner-basic-training-browser concise-result-browser career-result-clarity-browser merchant-benefit-browser character-controls-browser player-psi-browser survival-result-browser advancement-result-browser life-event-presentation-browser training-information-browser release-presentation-browser prisoner-lawyer-browser optional-benefit-browser relationship-events-browser core-life-events-browser source-checks-browser release-scope-browser vargr-training-browser constrained-awards-browser benefit-wagers-browser agent-cover-browser separate-borrowed-rolls-browser source-training-browser aslan-access-browser aslan-land-browser clan-asset-browser clan-share-browser browser review-browser expansion-browser benefit-browser aezorgh-browser aezorgh-selector-browser recovery-browser transfer-browser assignment-browser aslan-officer-browser aslan-restoration-browser aslan-outlaw-browser aslan-origin-browser; do
            echo "Running browser suite: $suite"
            node "tools/character-generator/verification/$suite.mjs" "$RUNNER_TEMP/character-playwright/node_modules/playwright" || failures=$((failures + 1))
          done
          test "$failures" -eq 0
      - name: Preserved deferred development browser regressions
        if: ${{ !cancelled() && steps.browser-install.outcome == 'success' }}
        run: |
          failures=0
          for suite in games-browser reeducation-browser merchant-fine-browser zhodani-choice-browser cross-career-browser; do
            echo "Running browser suite: $suite"
            node "tools/character-generator/verification/$suite.mjs" "$RUNNER_TEMP/character-playwright/node_modules/playwright" || failures=$((failures + 1))
          done
          test "$failures" -eq 0
      - name: Upload review screenshots and results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: character-generator-review-${{ github.event.pull_request.head.sha }}
          path: tools/character-generator/verification/artifacts/
          if-no-files-found: warn

  precareer-review:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '22'
      - name: Install pinned Chromium runner
        run: |
          npm install --prefix "$RUNNER_TEMP/character-playwright" --no-save --package-lock=false --ignore-scripts --no-audit --no-fund playwright@1.58.2
          # Ubuntu 24.04 runners provide Chromium runtime libraries and standard fonts.
          node "$RUNNER_TEMP/character-playwright/node_modules/playwright/cli.js" install chromium
      - name: Approved Pre-Career screen interactions
        run: node tools/character-generator/verification/precareer-popup-browser.mjs "$RUNNER_TEMP/character-playwright/node_modules/playwright"
      - name: Player-facing setup and species record review
        run: |
          for suite in opening-help-browser clan-share-browser aslan-land-browser; do
            node "tools/character-generator/verification/$suite.mjs" "$RUNNER_TEMP/character-playwright/node_modules/playwright"
          done
      - name: Upload Pre-Career working-screen review
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: precareer-working-review-${{ github.event.pull_request.head.sha }}
          path: |
            tools/character-generator/verification/artifacts/precareer-popup-*
            tools/character-generator/verification/artifacts/opening-informationals-*
            tools/character-generator/verification/artifacts/clan-share-*
            tools/character-generator/verification/artifacts/aslan-land-*
          if-no-files-found: warn

  crow-warning-review:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '22'
      - name: Install pinned screenshot runner
        run: |
          npm install --prefix "$RUNNER_TEMP/character-playwright" --no-save --package-lock=false --ignore-scripts --no-audit --no-fund playwright@1.58.2
          node "$RUNNER_TEMP/character-playwright/node_modules/playwright/cli.js" install --with-deps chromium
      - name: Capture focused Crow desktop and phone review
        run: |
          node tools/character-generator/verification/crow-mockup-browser.mjs "$RUNNER_TEMP/character-playwright/node_modules/playwright"
          node tools/character-generator/verification/technical-error-browser.mjs "$RUNNER_TEMP/character-playwright/node_modules/playwright"
          node tools/character-generator/verification/crow-recovery-browser.mjs "$RUNNER_TEMP/character-playwright/node_modules/playwright"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: crow-warning-review-${{ github.event.pull_request.head.sha }}
          path: |
            tools/character-generator/verification/artifacts/crow-review-*
            tools/character-generator/verification/artifacts/crow-error-*
            tools/character-generator/verification/artifacts/crow-recovery-*
          if-no-files-found: error

  army-pilot-review:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '22'
      - name: Install pinned review runner
        run: |
          npm install --prefix "$RUNNER_TEMP/character-playwright" --no-save --package-lock=false --ignore-scripts --no-audit --no-fund playwright@1.58.2
          node "$RUNNER_TEMP/character-playwright/node_modules/playwright/cli.js" install chromium
      - name: Army pilot end-to-end desktop and phone review
        run: node tools/character-generator/verification/army-pilot-browser.mjs "$RUNNER_TEMP/character-playwright/node_modules/playwright"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: army-pilot-review-${{ github.event.pull_request.head.sha }}
          path: tools/character-generator/verification/artifacts/army-pilot-*
          if-no-files-found: error

  aslan-career-template-review:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '22'
      - name: Install pinned Aslan review runner
        run: |
          npm install --prefix "$RUNNER_TEMP/character-playwright" --no-save --package-lock=false --ignore-scripts --no-audit --no-fund playwright@1.58.2
          node "$RUNNER_TEMP/character-playwright/node_modules/playwright/cli.js" install chromium
      - name: Native Aslan specialties, recovery and complete Crow wardrobe
        run: |
          node tools/character-generator/verification/aslan-career-template-browser.mjs "$RUNNER_TEMP/character-playwright/node_modules/playwright"
          node tools/character-generator/verification/aslan-extra-dice-browser.mjs "$RUNNER_TEMP/character-playwright/node_modules/playwright"
      - name: Upload Aslan screens and complete outfit set
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: aslan-career-template-review-${{ github.event.pull_request.head.sha }}
          path: tools/character-generator/verification/artifacts/aslan-career-template-*
          if-no-files-found: error

  imperial-template-review:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '22'
      - name: Install pinned review runner
        run: |
          npm install --prefix "$RUNNER_TEMP/character-playwright" --no-save --package-lock=false --ignore-scripts --no-audit --no-fund playwright@1.58.2
          node "$RUNNER_TEMP/character-playwright/node_modules/playwright/cli.js" install chromium
      - name: Imperial specialty desktop and phone review
        run: |
          node tools/character-generator/verification/imperial-template-browser.mjs "$RUNNER_TEMP/character-playwright/node_modules/playwright"
          node tools/character-generator/verification/crow-outfit-contrast-browser.mjs "$RUNNER_TEMP/character-playwright/node_modules/playwright"
          node tools/character-generator/verification/career-costume-error-browser.mjs "$RUNNER_TEMP/character-playwright/node_modules/playwright"
          node tools/character-generator/verification/completion-presentation-browser.mjs "$RUNNER_TEMP/character-playwright/node_modules/playwright"
          node tools/character-generator/verification/iron-man-browser.mjs "$RUNNER_TEMP/character-playwright/node_modules/playwright"
          node tools/character-generator/verification/completion-comparison-browser.mjs "$RUNNER_TEMP/character-playwright/node_modules/playwright"
      - name: Upload explicit Iron Man previews
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: iron-man-review-${{ github.event.pull_request.head.sha }}
          path: tools/character-generator/verification/artifacts/imperial-iron-man-*
          if-no-files-found: error
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: imperial-template-review-${{ github.event.pull_request.head.sha }}
          path: tools/character-generator/verification/artifacts/imperial-*
          if-no-files-found: error

  qualification-fallback-review:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '22'
      - name: Install pinned review runner
        run: |
          npm install --prefix "$RUNNER_TEMP/character-playwright" --no-save --package-lock=false --ignore-scripts --no-audit --no-fund playwright@1.58.2
          node "$RUNNER_TEMP/character-playwright/node_modules/playwright/cli.js" install chromium
      - name: RAW qualification fallback desktop and mobile review
        run: node tools/character-generator/verification/qualification-fallback-browser.mjs "$RUNNER_TEMP/character-playwright/node_modules/playwright"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: qualification-fallback-review-${{ github.event.pull_request.head.sha }}
          path: tools/character-generator/verification/artifacts/qualification-fallback-*
          if-no-files-found: error

  career-checkpoint-review:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '22'
      - name: Install pinned review runner
        run: |
          npm install --prefix "$RUNNER_TEMP/character-playwright" --no-save --package-lock=false --ignore-scripts --no-audit --no-fund playwright@1.58.2
          node "$RUNNER_TEMP/character-playwright/node_modules/playwright/cli.js" install chromium
      - name: Shared career roll and award checkpoints
        run: node tools/character-generator/verification/career-checkpoint-browser.mjs "$RUNNER_TEMP/character-playwright/node_modules/playwright"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: career-checkpoint-review-${{ github.event.pull_request.head.sha }}
          path: tools/character-generator/verification/artifacts/career-checkpoint-*
          if-no-files-found: error

  vargr-career-template-review:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '22'
      - name: Install pinned Vargr review runner
        run: |
          npm install --prefix "$RUNNER_TEMP/character-playwright" --no-save --package-lock=false --ignore-scripts --no-audit --no-fund playwright@1.58.2
          node "$RUNNER_TEMP/character-playwright/node_modules/playwright/cli.js" install chromium
      - name: Native Vargr specialties, information and state preservation
        run: |
          node tools/character-generator/verification/vargr-career-template-browser.mjs "$RUNNER_TEMP/character-playwright/node_modules/playwright"
      - name: Vargr fallback choices and recorded referee mappings
        run: node tools/character-generator/verification/vargr-fallback-browser.mjs "$RUNNER_TEMP/character-playwright/node_modules/playwright"
      - name: Upload Vargr desktop and phone screens
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: vargr-career-template-review-${{ github.event.pull_request.head.sha }}
          path: |
            tools/character-generator/verification/artifacts/vargr-career-template-*
            tools/character-generator/verification/artifacts/vargr-fallback-*
          if-no-files-found: error
