name: Tool Locker checks
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - 'tools/traveller_tools_buttons/**'
      - 'changes/locker.html'
      - 'index.html'
      - '.github/workflows/tool-locker.yml'
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
      - name: Verify exact revision and shared integration
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          git rev-parse HEAD
          node --test tests/tool-visits.test.cjs
      - name: Set up browser verification
        run: |
          npm install --prefix "$RUNNER_TEMP/locker-playwright" --no-save --package-lock=false --ignore-scripts --no-audit --no-fund playwright@1.58.2
          node "$RUNNER_TEMP/locker-playwright/node_modules/playwright/cli.js" install --with-deps chromium
      - name: Check Tool Locker and changelog in Chromium
        env:
          PLAYWRIGHT_MODULE: ${{ runner.temp }}/locker-playwright/node_modules/playwright
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 > /tmp/locker-server.log 2>&1 &
          node tools/traveller_tools_buttons/verification/browser.cjs
