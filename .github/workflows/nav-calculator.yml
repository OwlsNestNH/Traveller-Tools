name: Nav Calculator checks
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - 'tools/nav-calculator/**'
      - 'changes/nav.html'
      - 'index.html'
      - '.github/workflows/nav-calculator.yml'
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
      - name: Verify exact revision and shared integration
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          git rev-parse HEAD
          node --test tests/tool-visits.test.cjs
      - name: Set up browser verification
        run: |
          npm install --prefix "$RUNNER_TEMP/nav-playwright" --no-save --package-lock=false --ignore-scripts --no-audit --no-fund playwright@1.58.2
          node "$RUNNER_TEMP/nav-playwright/node_modules/playwright/cli.js" install --with-deps chromium
      - name: Check calculations, audit fixes, aligned controls and changelog in Chromium
        env:
          PLAYWRIGHT_MODULE: ${{ runner.temp }}/nav-playwright/node_modules/playwright
        run: |
          node tools/nav-calculator/verification/nav.test.mjs "$PLAYWRIGHT_MODULE"
          node tools/nav-calculator/verification/audit.test.mjs
          node tools/nav-calculator/verification/layout.test.mjs
