name: Career control clarity review
on:
  pull_request:
    paths:
      - 'tools/character-generator/**'
      - '.github/workflows/career-controls-review.yml'
permissions:
  contents: read
jobs:
  career-control-clarity:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '22'
      - name: Install pinned browser runner
        run: |
          npm install --prefix "$RUNNER_TEMP/character-playwright" --no-save --package-lock=false --ignore-scripts --no-audit --no-fund playwright@1.58.2
          node "$RUNNER_TEMP/character-playwright/node_modules/playwright/cli.js" install chromium
      - name: Career labels, entry semantics, notes and printing
        run: |
          node tools/character-generator/verification/career-control-clarity-browser.mjs "$RUNNER_TEMP/character-playwright/node_modules/playwright"
          node tools/character-generator/verification/house-rules-concise-preview.mjs "$RUNNER_TEMP/character-playwright/node_modules/playwright"
          node tools/character-generator/verification/toolbar-fit-browser.mjs "$RUNNER_TEMP/character-playwright/node_modules/playwright"
          node tools/character-generator/verification/final-benefit-browser.mjs "$RUNNER_TEMP/character-playwright/node_modules/playwright"
          node tools/character-generator/verification/psionic-access-browser.mjs "$RUNNER_TEMP/character-playwright/node_modules/playwright"
          node tools/character-generator/verification/psionic-course-browser.mjs "$RUNNER_TEMP/character-playwright/node_modules/playwright"
          node tools/character-generator/verification/psionic-payment-browser.mjs "$RUNNER_TEMP/character-playwright/node_modules/playwright"
          node tools/character-generator/verification/drifter-fallback-browser.mjs "$RUNNER_TEMP/character-playwright/node_modules/playwright"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: career-control-clarity-${{ github.event.pull_request.head.sha }}
          path: |
            tools/character-generator/verification/artifacts/career-control-*.png
            tools/character-generator/verification/artifacts/toolbar-fit-*.png
            tools/character-generator/verification/artifacts/house-rules-*.png
            tools/character-generator/verification/artifacts/psi-*.png
            tools/character-generator/verification/artifacts/final-benefit-*.png
            tools/character-generator/verification/artifacts/after-final-benefit-*.png
            tools/character-generator/verification/artifacts/drifter-*.png

          if-no-files-found: error
