name: Additional Crow review-only previews
on:
  push:
    branches: [review/crow-scholar-agent]
permissions:
  contents: read
jobs:
  preview:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 22
      - name: Install pinned browser
        run: |
          npm install --prefix "$RUNNER_TEMP/crow-preview" playwright@1.58.2
          "$RUNNER_TEMP/crow-preview/node_modules/.bin/playwright" install --with-deps chromium
      - name: Render isolated art previews
        run: node tools/character-generator/verification/additional-crow-preview-browser.mjs "$RUNNER_TEMP/crow-preview/node_modules/playwright"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: crow-additional-preview-${{ github.sha }}
          path: tools/character-generator/verification/artifacts/additional-crow-*
          if-no-files-found: error
