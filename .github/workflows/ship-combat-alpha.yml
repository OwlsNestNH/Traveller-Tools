name: Ship combat alpha checks
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - 'tools/ship-combat-alpha/**'
      - 'index.html'
      - '.github/workflows/ship-combat-alpha.yml'
permissions:
  contents: read
concurrency:
  group: ship-combat-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  engine:
    name: Movement engine and command contract
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '22'
      - name: Syntax, engine, replay and proportional geometry
        run: |
          for file in tools/ship-combat-alpha/*.mjs tools/ship-combat-alpha/verification/*.mjs; do node --check "$file"; done
          node --test tools/ship-combat-alpha/verification/ship-sheet-draft.test.mjs tools/ship-combat-alpha/verification/design-drive.test.mjs tools/ship-combat-alpha/verification/shared-hex.test.mjs tools/ship-combat-alpha/verification/crew-roster.test.mjs tools/ship-combat-alpha/verification/weapon-fit.test.mjs tools/ship-combat-alpha/verification/pilot-check.test.mjs tools/ship-combat-alpha/verification/weapon-supply.test.mjs tools/ship-combat-alpha/verification/compact-crew.test.mjs tools/ship-combat-alpha/verification/unknown-value.test.mjs tools/ship-combat-alpha/verification/station-pane.test.mjs tools/ship-combat-alpha/verification/wreck.test.mjs tools/ship-combat-alpha/verification/catalogue-equipment.test.mjs tools/ship-combat-alpha/verification/sample-equivalence.test.mjs tools/ship-combat-alpha/verification/add-loadout.test.mjs tools/ship-combat-alpha/verification/engine.test.mjs tools/ship-combat-alpha/verification/records.test.mjs tools/ship-combat-alpha/verification/systems.test.mjs tests/tool-visits.test.cjs
  browser:
    name: Movement UI desktop and mobile
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      SHIP_COMBAT_TEST_ROOT: http://127.0.0.1:8767/
      SHIP_COMBAT_COMMIT: ${{ github.event.pull_request.head.sha }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '22'
      - name: Install pinned Chromium runner
        run: |
          npm install --prefix "$RUNNER_TEMP/ship-playwright" --no-save --package-lock=false --ignore-scripts --no-audit --no-fund playwright@1.58.2
          node "$RUNNER_TEMP/ship-playwright/node_modules/playwright/cli.js" install --with-deps chromium
      - name: Exercise synthetic movement without campaign storage
        run: |
          python3 -m http.server 8767 --bind 127.0.0.1 > "$RUNNER_TEMP/ship-server.log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in {1..30}; do if curl --fail --silent "$SHIP_COMBAT_TEST_ROOT" > /dev/null; then break; fi; sleep 1; done
          node tools/ship-combat-alpha/verification/browser.mjs "$RUNNER_TEMP/ship-playwright/node_modules/playwright"
      - name: Upload bounded movement evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ship-combat-${{ github.event.pull_request.head.sha }}
          path: tools/ship-combat-alpha/verification-artifacts/
          if-no-files-found: warn
      - name: Upload small Add Ship review evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: add-ship-review-${{ github.event.pull_request.head.sha }}
          path: |
            tools/ship-combat-alpha/verification-artifacts/add-screen-*.png
            tools/ship-combat-alpha/verification-artifacts/add-screen-images-*.json
          if-no-files-found: warn
      - name: Upload small icon growth review evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: icon-growth-review-${{ github.event.pull_request.head.sha }}
          path: |
            tools/ship-combat-alpha/verification-artifacts/*icon-fit-*.json
            tools/ship-combat-alpha/verification-artifacts/*icon-fit-*-normal-1876.png
            tools/ship-combat-alpha/verification-artifacts/*icon-fit-*-expanded-1876.png
            tools/ship-combat-alpha/verification-artifacts/*icon-fit-*-normal-320.png
            tools/ship-combat-alpha/verification-artifacts/*icon-fit-*-expanded-320.png
          if-no-files-found: warn
      - name: Upload small sample encounter review evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: sample-encounter-review-${{ github.event.pull_request.head.sha }}
          path: |
            tools/ship-combat-alpha/verification-artifacts/sample-encounter-*.json
            tools/ship-combat-alpha/verification-artifacts/sample-encounter-*.png
            tools/ship-combat-alpha/verification-artifacts/sample-silhouettes-*.png
          if-no-files-found: warn

      - name: Upload small wreck review evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: wreck-review-${{ github.event.pull_request.head.sha }}
          path: tools/ship-combat-alpha/verification-artifacts/wreck-*
          if-no-files-found: warn


      - name: Upload small station review evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: station-review-${{ github.event.pull_request.head.sha }}
          path: tools/ship-combat-alpha/verification-artifacts/station-*
          if-no-files-found: warn
      - name: Upload small Unknown-value review evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: unknown-review-${{ github.event.pull_request.head.sha }}
          path: tools/ship-combat-alpha/verification-artifacts/unknown-*
          if-no-files-found: warn

      - name: Upload small switch review evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: switches-review-${{ github.event.pull_request.head.sha }}
          path: tools/ship-combat-alpha/verification-artifacts/switches-*
          if-no-files-found: warn

      - name: Upload small map stability evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: map-stability-review-${{ github.event.pull_request.head.sha }}
          path: tools/ship-combat-alpha/verification-artifacts/map-stability-*
          if-no-files-found: warn
