name: Request current main Pages build
on:
  workflow_dispatch:
    inputs:
      expected_main_sha:
        description: Full reviewed and tested main commit SHA to publish
        required: true
        type: string
permissions: {}
concurrency:
  group: pages-manual-rebuild
  cancel-in-progress: false
jobs:
  rebuild:
    if: github.repository == 'OwlsNestNH/Traveller-Tools' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: github-pages
    permissions:
      contents: read
      pages: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      EXPECTED_SHA: ${{ inputs.expected_main_sha }}
      DISPATCH_SHA: ${{ github.sha }}
    steps:
      - name: Verify current source and request one build
        shell: bash
        run: |
          set -euo pipefail
          [[ "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo 'Expected SHA must be a full lowercase commit SHA'; exit 1; }
          [[ "$EXPECTED_SHA" == "$DISPATCH_SHA" ]] || { echo 'Dispatch was not made at the expected main revision'; exit 1; }
          api() { gh api -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28" "$@"; }
          repo="repos/$GH_REPO"
          [[ "$(api "$repo" --jq .default_branch)" == main ]] || { echo 'Default branch changed; refusing'; exit 1; }
          api "$repo/pages" > "$RUNNER_TEMP/pages-source.json"
          jq -e '.build_type == "legacy" and .source.branch == "main" and .source.path == "/"' "$RUNNER_TEMP/pages-source.json" >/dev/null || { echo 'Pages is no longer main/root branch publishing; refusing'; exit 1; }
          [[ "$(api "$repo/commits/main" --jq .sha)" == "$EXPECTED_SHA" ]] || { echo 'Main advanced; review the new revision first'; exit 1; }
          previous_build=$(api "$repo/pages/builds/latest" --jq .url)
          # No automatic retry: an uncertain POST may already have queued a build.
          api --method POST "$repo/pages/builds" > "$RUNNER_TEMP/pages-request.json"
          echo "Requested Pages build for expected revision $EXPECTED_SHA" >> "$GITHUB_STEP_SUMMARY"
          for attempt in $(seq 1 60); do
            [[ "$(api "$repo/commits/main" --jq .sha)" == "$EXPECTED_SHA" ]] || { echo 'Main advanced during publication; manually inspect the build before claiming success'; exit 1; }
            api "$repo/pages/builds/latest" > "$RUNNER_TEMP/pages-build.json"
            commit=$(jq -r '.commit // ""' "$RUNNER_TEMP/pages-build.json")
            status=$(jq -r '.status // ""' "$RUNNER_TEMP/pages-build.json")
            build_url=$(jq -r '.url // ""' "$RUNNER_TEMP/pages-build.json")
            if [[ "$commit" == "$EXPECTED_SHA" && -n "$build_url" && "$build_url" != "$previous_build" ]]; then
              if [[ "$status" == built ]]; then
                echo "Verified Pages build receipt for $EXPECTED_SHA. Live URL/content still needs independent verification." >> "$GITHUB_STEP_SUMMARY"
                exit 0
              fi
              if [[ "$status" == errored ]]; then
                jq -r '.error.message // "Pages build errored"' "$RUNNER_TEMP/pages-build.json"
                exit 1
              fi
            fi
            sleep 10
          done
          echo 'No successful build receipt for the expected revision within ten minutes'
          exit 1
